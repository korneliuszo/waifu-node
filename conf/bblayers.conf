LCONF_VERSION = "7"

BBPATH = "${TOPDIR}"
BBFILES ?= ""

BBLAYERS ?= " \
  ${TOPDIR}/external-layers/openembedded-core/meta \
  ${TOPDIR}/external-layers/meta-tegra \
  ${TOPDIR}/external-layers/meta-tegra-community \
  ${TOPDIR}/external-layers/meta-openembedded/meta-oe \
  ${TOPDIR}/external-layers/meta-openembedded/meta-filesystems \
  ${TOPDIR}/external-layers/meta-openembedded/meta-networking \
  ${TOPDIR}/external-layers/meta-openembedded/meta-python \
  ${TOPDIR}/external-layers/meta-virtualization \
  ${TOPDIR}/external-layers/meta-browser/meta-firefox \
  ${TOPDIR}/meta-waifu-node \
  "
