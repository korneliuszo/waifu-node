# ===========================================================================
# waifu-node — layer.conf (root layer)
# Declares the project root as a bitbake layer.
# ===========================================================================

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend \
           "

BBFILE_COLLECTIONS += "waifu-node"
BBFILE_PATTERN_waifu-node = "^${LAYERDIR}/"
BBFILE_PRIORITY_waifu-node = "99"

WAIFU_NODE_LAYER_BASE = '${@os.path.normpath("${LAYERDIR}")}'

LAYERSERIES_COMPAT_waifu-node = "wrynose" 
