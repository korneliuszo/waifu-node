# ===========================================================================
# waifu-node — distro configuration
# ===========================================================================

# Distro name
DISTRO = "waifu-node"
DISTRO_NAME = "waifu-node"
DISTRO_VERSION = "1.0"
DISTRO_VENDOR = "waifu-node"
DISTRO_CODENAME = "wrynose"

FORTRAN:forcevariable = ",fortran"
HOSTTOOLS_NONFATAL += "gfortran"
#RUNTIMETARGET:append:class-native = " fortran"
#RUNTIMETARGET:append:pn-gcc-runtime = " libquadmath libgfortran"

# Default features (new syntax for bitbake 2.18)
DISTRO_FEATURES_DEFAULTS:append = " wayland x11 opengl pam systemd opencl"

PACKAGECONFIG:remove:pn-mesa = "gallium-llvm"

BLAS_AARCH64_ARCH := "ARMV9SME"
#PACKAGECONFIG:pn-python3-scipy := "lapack"
PACKAGECONFIG:pn-openblas := "openmp lapack lapacke"
#PACKAGECONFIG:pn-lapack := "cblas lapacke"
#PTEST_ENABLED:pn-lapack := "0"

PREFERRED_PROVIDER_python3-onnx := "onnx"
#PREFERRED_PROVIDER_python3-pytorch := "pytorch" 
#RPROVIDES:python3-torch = "python3-pytorch"

# License flags
LICENSE_FLAGS_ACCEPTED = "commercial"
